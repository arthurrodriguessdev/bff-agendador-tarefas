services:
  agendador-tarefas:
#    image: arthurrodriguesr/agendador-tarefas:latest
    build: "../agendador-tarefas"
    container_name: agendador-tarefas
    ports:
      - "${PORTA_AGENDADOR}:${PORTA_AGENDADOR}"
    environment:
      - USUARIO_URL=http://usuario:8080
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    depends_on:
      - postgres
      - usuario
      - kafka

  bff-agendador-tarefas:
    build: .
    container_name: bff-agendador-tarefas
    ports:
      - "${PORTA_BFF}:${PORTA_BFF}"
    environment:
      - CLIENT_URL_USUARIO=http://usuario:${PORTA_USUARIO}
      - CLIENT_URL_TAREFA=http://agendador-tarefas:${PORTA_AGENDADOR}/api/v1
      - CLIENT_URL_NOTIFICACAO=http://notificacao:${PORTA_NOTIFICACAO}
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    depends_on:
      - usuario
      - agendador-tarefas
      - notificacao

  usuario:
#    image: arthurrodriguesr/usuario:latest
    build: "../usuario"
    container_name: usuario
    ports:
      - "${PORTA_USUARIO}:${PORTA_USUARIO}"
    environment:
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    depends_on:
      - postgres

  notificacao:
    build: "../notificacao"
#    image: arthurrodriguesr/notificacao:latest
    container_name: notificacao
    ports:
      - "${PORTA_NOTIFICACAO}:${PORTA_NOTIFICACAO}"
    environment:
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    depends_on:
      - usuario
      - agendador-tarefas
      - kafka

  postgres:
    image: postgres:latest
    container_name: postgres
    env_file:
      - .env
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${PORTA_POSTGRES}:5432"
  kafka:
    image: apache/kafka:latest
    container_name: shop-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
networks:
  default:
    driver: bridge